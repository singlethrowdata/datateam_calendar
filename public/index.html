<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team Calendar</title>
<style>
  :root {
    --ink: #111111;
    --paper: #F5F3EE;
    --card: #FFFFFF;
    --accent: #2453FF;
    --accent-ink: #FFFFFF;
    --line: #111111;
    --muted: #6B6B63;
    --today: #FFD23F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  .layout-grid {
    display: flex;
    align-items: flex-start;
    gap: 28px;
  }

  .main-col {
    flex: 1;
    min-width: 0;
  }

  .sidebar {
    width: 300px;
    flex-shrink: 0;
    position: sticky;
    top: 20px;
  }

  @media (max-width: 900px) {
    .layout-grid { flex-direction: column; }
    .sidebar { width: 100%; position: static; }
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    border-bottom: 4px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  h1 {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -0.02em;
    margin: 0;
    text-transform: uppercase;
  }

  .sync-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border: 2px solid var(--line);
    background: var(--card);
    padding: 8px 12px;
    box-shadow: 3px 3px 0 var(--line);
  }

  .sync-status { flex-wrap: wrap; max-width: 560px; }

  .backend-note {
    font-size: 11px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--muted);
  }

  .backend-note.warn { color: #E74C3C; font-weight: 700; }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2ECC71;
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  .pulse-dot.stale { background: #E74C3C; animation: none; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(46,204,113,0.6); }
    70% { box-shadow: 0 0 0 6px rgba(46,204,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
  }

  .calendar-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .calendar-nav-title {
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }

  .calendar-nav-buttons { display: flex; gap: 8px; }

  .nav-btn {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 14px;
    border: 2px solid var(--line);
    background: var(--card);
    padding: 6px 14px;
    cursor: pointer;
  }

  .nav-btn:hover { background: var(--accent); color: var(--accent-ink); }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    border: 2.5px solid var(--line);
    background: var(--line);
    gap: 2px;
  }

  .weekday-header {
    background: var(--ink);
    color: var(--accent-ink);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: center;
    padding: 6px 0;
  }

  .day-cell {
    background: var(--card);
    min-height: 96px;
    min-width: 0;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
  }

  .day-cell.outside-month { background: #ECE9E1; }
  .day-cell.is-today { background: #FFF6D9; }

  .day-number {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 12px;
    color: var(--muted);
    align-self: flex-end;
  }

  .day-cell.is-today .day-number {
    background: var(--today);
    border: 2px solid var(--line);
    color: var(--ink);
    padding: 0 6px;
  }

  .day-chip {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    font-size: 10.5px;
    line-height: 1.25;
    background: var(--ink);
    color: var(--accent-ink);
    padding: 2px 5px;
    overflow-wrap: anywhere;
    cursor: default;
  }

  .day-chip.due-chip {
    background: var(--today);
    color: var(--ink);
    border: 1.5px solid var(--ink);
    padding: 1px 4px;
  }

  .day-chip.due-chip.overdue {
    background: #E74C3C;
    color: #FFFFFF;
  }

  .view-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .view-toggle { display: flex; }

  .view-btn {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border: 2px solid var(--line);
    background: var(--card);
    padding: 6px 12px;
    cursor: pointer;
    user-select: none;
    margin-left: -2px;
  }

  .view-btn:first-child { margin-left: 0; }
  .view-btn:hover { background: #EAF1FF; }
  .view-btn.active { background: var(--accent); color: var(--accent-ink); }

  .view-note {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .day-popover-section {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    border-bottom: 1.5px solid var(--line);
    margin: 10px 0 6px;
    padding-bottom: 2px;
  }

  .day-popover-section:first-of-type { margin-top: 0; }

  .day-chip-more {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--muted);
    font-weight: 700;
  }

  /* Who is responsible — shown under each meeting on the month grid */
  .day-claimants {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    margin: 0 0 3px;
  }

  .day-claimant {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    font-weight: 700;
    line-height: 1.3;
    color: #FFFFFF;
    padding: 1px 4px;
    border: 1.5px solid var(--line);
    white-space: nowrap;
  }

  .day-claimant.unclaimed {
    background: var(--card);
    color: var(--muted);
    border: 1.5px dashed var(--muted);
    font-weight: 400;
  }

  .day-popover-claimants {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
  }

  .day-popover-resp-label {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
  }

  @media (max-width: 640px) {
    .day-cell { min-height: 64px; padding: 4px; }
    .weekday-header { font-size: 9px; }
    .day-chip { font-size: 9px; }
  }

  .day-popover {
    position: fixed;
    z-index: 10;
    max-width: 280px;
    background: var(--card);
    border: 2.5px solid var(--line);
    box-shadow: 5px 5px 0 var(--line);
    padding: 12px 14px;
  }

  .day-popover-title {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .day-popover-item { margin-bottom: 8px; }
  .day-popover-item:last-child { margin-bottom: 0; }

  .day-popover-time {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 12px;
  }

  .day-popover-close {
    position: absolute;
    top: 6px;
    right: 8px;
    cursor: pointer;
    font-weight: 700;
    font-family: 'Courier New', monospace;
  }

  .client-tag {
    display: inline-block;
    background: var(--ink);
    color: var(--accent-ink);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    margin-right: 6px;
  }

  .meeting-type-tag {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
  }

  .am-tag {
    display: inline-block;
    background: #7C3AED;
    color: #FFFFFF;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    margin-left: 6px;
    text-decoration: none;
    cursor: default;
  }

  a.am-tag { cursor: pointer; }
  a.am-tag:hover { background: #5B21B6; }

  .upcoming-type {
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 1px 7px;
    flex-shrink: 0;
  }

  .empty-state, .error-state {
    border: 2.5px dashed var(--line);
    padding: 40px 20px;
    text-align: center;
    font-family: 'Courier New', monospace;
    color: var(--muted);
  }

  .error-state { border-color: #E74C3C; color: #E74C3C; }

  footer {
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 40px;
  }

  .upcoming-section {
    margin-top: 40px;
    border-top: 4px solid var(--line);
    padding-top: 22px;
  }

  .upcoming-hint {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
    margin: -6px 0 14px;
  }

  .upcoming-row[draggable="true"] {
    cursor: grab;
  }

  .upcoming-row.dragging {
    opacity: 0.4;
  }

  .claimant-tag {
    display: inline-block;
    color: #FFFFFF;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    flex-shrink: 0;
    border: 2px solid var(--line);
  }

  .mini-claim-chip {
    display: inline-flex;
    align-items: stretch;
    border: 2px solid var(--line);
    box-shadow: 2px 2px 0 var(--line);
    overflow: hidden;
    vertical-align: middle;
    margin: 2px 0;
  }

  .mini-claim-chip .claimant-tag {
    border: none;
    display: flex;
    align-items: center;
  }

  .mini-due-panel {
    display: flex;
    align-items: center;
    padding: 0 6px;
    border-left: 2px solid var(--line);
  }

  .mini-due-input {
    background: transparent;
    border: none;
    color: #FFFFFF;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;
    width: 88px;
    padding: 2px 0;
  }

  .mini-due-input::placeholder {
    color: rgba(255, 255, 255, 0.75);
  }

  .team-group {
    margin-bottom: 18px;
  }

  .team-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    border-bottom: 2px solid var(--line);
    padding-bottom: 4px;
    margin-bottom: 8px;
  }

  .person-lane {
    margin-bottom: 10px;
  }

  .person-lane-name {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .person-color-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    flex-shrink: 0;
  }

  .person-lane-drop {
    min-height: 46px;
    border: 2px dashed var(--line);
    padding: 6px;
    transition: background 0.15s, border-color 0.15s;
  }

  .person-lane-drop.drag-over {
    background: #EAF1FF;
    border-color: var(--accent);
    border-style: solid;
  }

  .person-lane-empty {
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    color: var(--muted);
    padding: 6px 4px;
  }

  .claim-card {
    display: flex;
    align-items: stretch;
    background: var(--card);
    border: 2px solid var(--line);
    box-shadow: 2px 2px 0 var(--line);
    margin-bottom: 6px;
    overflow: hidden;
  }

  .claim-card-due-panel {
    flex-shrink: 0;
    width: 88px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 4px;
    border-right: 2px solid var(--line);
  }

  .claim-card-due-panel .due-date-input {
    background: transparent;
    border: none;
    color: #FFFFFF;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    width: 100%;
    text-align: center;
    padding: 0;
  }

  .claim-card-due-panel .due-date-input::placeholder {
    color: rgba(255, 255, 255, 0.75);
  }

  .claim-card-body {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
  }

  .claim-card-title {
    flex: 1;
    min-width: 0;
    font-weight: 700;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .claim-release-btn {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 13px;
    line-height: 1;
    border: 2px solid var(--line);
    background: var(--card);
    padding: 3px 7px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .claim-release-btn:hover {
    background: #E74C3C;
    color: #FFFFFF;
    border-color: #E74C3C;
  }

  .upcoming-heading {
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
  }

  .upcoming-row {
    display: grid;
    grid-template-columns: 120px 130px 1fr;
    gap: 14px;
    align-items: center;
    padding: 12px 16px;
    background: var(--card);
    border: 2px solid var(--line);
    border-left: 8px solid var(--muted);
    margin-bottom: 8px;
  }

  .upcoming-row.urgency-today {
    border-left-color: #E74C3C;
    background: #FDECEA;
  }

  .upcoming-row.urgency-tomorrow {
    border-left-color: #FF8C42;
    background: #FFF3E8;
  }

  .upcoming-row.urgency-week {
    border-left-color: #F2B705;
    background: #FFFAEA;
  }

  .upcoming-row.urgency-later {
    border-left-color: var(--accent);
    background: var(--card);
  }

  .upcoming-row:nth-child(1) { box-shadow: 4px 4px 0 var(--accent); border-color: var(--accent); }

  .upcoming-date {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 16px;
    text-transform: uppercase;
    color: var(--ink);
  }

  .upcoming-time {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 17px;
  }

  .upcoming-info {
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }

  .upcoming-client {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--accent-ink);
    padding: 1px 7px;
    flex-shrink: 0;
  }

  .upcoming-title {
    font-weight: 700;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .moved-badge {
    display: inline-block;
    background: #E74C3C;
    color: #FFFFFF;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border: 2px solid var(--line);
    animation: moved-pulse 1.6s infinite;
    flex-shrink: 0;
  }

  @keyframes moved-pulse {
    0% { box-shadow: 0 0 0 0 rgba(231,76,60,0.6); }
    70% { box-shadow: 0 0 0 5px rgba(231,76,60,0); }
    100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); }
  }

  @media (max-width: 520px) {
    .upcoming-row { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Team Calendar</h1>
    <div class="sync-status" id="syncStatus">
      <span class="pulse-dot" id="pulseDot"></span>
      <span id="syncText">Connecting…</span>
      <span id="backendNote" class="backend-note"></span>
    </div>
  </header>

  <div class="layout-grid">
    <div class="main-col">
      <div class="calendar-nav">
        <div class="calendar-nav-title" id="calendarNavTitle"></div>
        <div class="calendar-nav-buttons">
          <div class="nav-btn" id="prevMonthBtn">‹ Prev</div>
          <div class="nav-btn" id="todayBtn">Today</div>
          <div class="nav-btn" id="nextMonthBtn">Next ›</div>
        </div>
      </div>

      <div class="view-row">
        <div class="view-toggle" id="viewToggle">
          <div class="view-btn" data-view="combined">Calls + due dates</div>
          <div class="view-btn" data-view="calls">Calls only</div>
          <div class="view-btn" data-view="due">Due dates only</div>
        </div>
        <span class="view-note">Due date = 3 days before the call</span>
      </div>

      <div id="content">
        <div class="empty-state">Loading events…</div>
      </div>

      <section class="upcoming-section">
        <h2 class="upcoming-heading">Coming Up</h2>
        <p class="upcoming-hint">Drag an item onto a name in "In Process" to claim it.</p>
        <div id="upcomingList"></div>
      </section>
    </div>

    <aside class="sidebar" id="inProcessSidebar">
      <h2 class="upcoming-heading">In Process</h2>
      <div id="inProcessTeams"></div>
    </aside>
  </div>

  <footer>Auto-refreshes every 5 minutes · Source: shared team Google Calendar</footer>
</div>

<script>
  // Paste your Apps Script Web App deployment URL here.
  const FEED_URL = 'https://script.google.com/macros/s/AKfycbwV0pSga31_HR5PGrKievnNrSLrjcrhGYhfluK20nFm56W9L7ekUY0PM4OUplVsHKwM/exec';
  const REFRESH_MS = 5 * 60 * 1000; // 5 minutes

  const contentEl = document.getElementById('content');
  const syncTextEl = document.getElementById('syncText');
  const pulseDotEl = document.getElementById('pulseDot');

  let allEvents = [];
  let viewMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  let calendarView = loadCalendarView_(); // 'combined' | 'calls' | 'due'

  function loadCalendarView_() {
    try {
      const v = localStorage.getItem('calendarView');
      if (v === 'combined' || v === 'calls' || v === 'due') return v;
    } catch (err) { /* storage unavailable — fall back to the default */ }
    return 'combined';
  }

  const WEEKDAY_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function formatTime(dateStr, allDay) {
    if (allDay) return 'All day';
    const d = new Date(dateStr);
    return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  function groupByDateKey(events) {
    const map = new Map();
    events.forEach(ev => {
      const key = new Date(ev.start).toDateString();
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(ev);
    });
    return map;
  }

  function renderUpcoming(events) {
    const upcomingEl = document.getElementById('upcomingList');
    const now = new Date();

    const upcoming = events
      .filter(ev => new Date(ev.end) >= now)
      .sort((a, b) => new Date(a.start) - new Date(b.start))
      .slice(0, 8);

    if (!upcoming.length) {
      upcomingEl.innerHTML = '<div class="empty-state">Nothing upcoming.</div>';
      return;
    }

    upcomingEl.innerHTML = upcoming.map(ev => {
      const d = new Date(ev.start);
      const dateStr = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      const daysUntil = Math.floor((new Date(d.toDateString()) - new Date(now.toDateString())) / 86400000);
      let urgencyClass = 'urgency-later';
      if (daysUntil <= 0) urgencyClass = 'urgency-today';
      else if (daysUntil === 1) urgencyClass = 'urgency-tomorrow';
      else if (daysUntil <= 7) urgencyClass = 'urgency-week';

      const claimants = ev.claimants || [];
      const claimedClass = claimants.length ? ' claimed' : '';
      const claimedBadge = claimants.map(c => claimantChipHtml_(ev, c)).join('');
      const movedBadge = ev.moved ? movedBadgeHtml_(ev) : '';

      return `
        <div class="upcoming-row ${urgencyClass}${claimedClass}" draggable="true" data-key="${escapeHtml(ev.key)}">
          <div class="upcoming-date">${dateStr}</div>
          <div class="upcoming-time">${formatTime(ev.start, ev.allDay)}</div>
          <div class="upcoming-info">
            <span class="upcoming-client">${escapeHtml(ev.client)}</span>
            <span class="upcoming-type">${escapeHtml(ev.meetingType)}</span>
            ${amTagHtml(ev, 'margin-left:0;')}
            <span class="upcoming-title">${escapeHtml(ev.title)}</span>
            ${movedBadge}
            ${claimedBadge}
          </div>
        </div>
      `;
    }).join('');

    upcomingEl.querySelectorAll('.upcoming-row[draggable="true"]').forEach(row => {
      row.addEventListener('dragstart', (e) => {
        // If the gesture started on the due-date picker (or any future interactive
        // control) inside the row, let it behave as a normal click instead of
        // hijacking it into a row-drag — otherwise clicking the date input can
        // fail to open the picker or register a value change.
        if (e.target.closest('input, select, textarea, a, button, .claim-release-btn')) {
          e.preventDefault();
          return;
        }
        e.dataTransfer.setData('text/plain', row.dataset.key);
        e.dataTransfer.effectAllowed = 'move';
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));
    });

    upcomingEl.querySelectorAll('.due-date-input').forEach(input => {
      wireDueDateTextInput_(input);
    });
  }

  /** Compact colored due-date chip for a single claimant — same component the sidebar claim cards use. */
  function claimantChipHtml_(ev, c) {
    const due = effectiveDue_(ev, c);
    const dueClass = dueDateClass_(due);
    const panelColor = dueClass === 'due-overdue' ? '#E74C3C' : dueClass === 'due-soon' ? '#B8860B' : personColor(c.claimedBy);
    return `
      <span class="mini-claim-chip">
        <span class="claimant-tag" style="background:${personColor(c.claimedBy)};" title="Claimed by ${escapeHtml(c.claimedBy)}">${escapeHtml(c.claimedBy)}</span>
        <span class="mini-due-panel" style="background:${panelColor};">
          <input type="text" inputmode="numeric" class="due-date-input mini-due-input" draggable="false" placeholder="M/D/YYYY" value="${escapeHtml(formatTypedDate_(due))}" data-current="${escapeHtml(due)}" data-max="${maxDueDate_(ev.start)}" title="Due automatically 3 days before the call (${escapeHtml(new Date(ev.start).toLocaleDateString())}). Type an earlier date to override; clear the box to go back to automatic." data-key="${escapeHtml(ev.key)}" data-person="${escapeHtml(c.claimedBy)}">
        </span>
      </span>
    `;
  }

  const TEAM_ROSTER = {
    'SEO & Content': ['Michael Falco', 'Stacey Berlin', 'Emily Butman', 'Julia Fescine', 'Mykenna Keene'],
    'Paid Advertisement': ['Stephan Simmons'],
    'CRO': ['Harrison Klostreich', 'Margarita Kuprin'],
  };

  // One fixed color per person — same color everywhere they show up
  // (Coming Up badges, sidebar lane headers, claim cards).
  const PERSON_COLORS = {
    'Michael Falco': '#2453FF',
    'Stacey Berlin': '#0F9D58',
    'Emily Butman': '#E67E22',
    'Stephan Simmons': '#E74C3C',
    'Julia Fescine': '#17A398',
    'Harrison Klostreich': '#D6336C',
    'Margarita Kuprin': '#8B5E34',
    'Mykenna Keene': '#3B8C6E',
  };
  function personColor(name) {
    return PERSON_COLORS[name] || '#6B6B63'; // muted gray fallback for anyone not in the map
  }

  function renderInProcessBoard() {
    const teamsEl = document.getElementById('inProcessTeams');
    const claimedByName = {};
    allEvents.forEach(ev => {
      (ev.claimants || []).forEach(c => {
        if (!claimedByName[c.claimedBy]) claimedByName[c.claimedBy] = [];
        claimedByName[c.claimedBy].push({ ev, claimedAt: c.claimedAt, dueDate: effectiveDue_(ev, c) });
      });
    });

    teamsEl.innerHTML = Object.entries(TEAM_ROSTER).map(([team, people]) => `
      <div class="team-group">
        <div class="team-label">${escapeHtml(team)}</div>
        ${people.map(person => {
          const items = (claimedByName[person] || []).sort((a, b) => new Date(a.claimedAt) - new Date(b.claimedAt));
          const cards = items.length
            ? items.map(({ ev, dueDate }) => {
                const dueClass = dueDateClass_(dueDate);
                const panelColor = dueClass === 'due-overdue' ? '#E74C3C' : dueClass === 'due-soon' ? '#B8860B' : personColor(person);
                return `
                <div class="claim-card" data-key="${escapeHtml(ev.key)}">
                  <div class="claim-card-due-panel ${dueClass}" style="background:${panelColor};">
                    <input type="text" inputmode="numeric" class="due-date-input" placeholder="M/D/YYYY" value="${escapeHtml(formatTypedDate_(dueDate))}" data-current="${escapeHtml(dueDate)}" data-max="${maxDueDate_(ev.start)}" title="Due automatically 3 days before the call (${escapeHtml(new Date(ev.start).toLocaleDateString())}). Type an earlier date to override; clear the box to go back to automatic." data-key="${escapeHtml(ev.key)}" data-person="${escapeHtml(person)}">
                  </div>
                  <div class="claim-card-body">
                    <span class="claim-card-title" title="${escapeHtml(ev.client + ' — ' + ev.meetingType + ': ' + ev.title)}">${escapeHtml(ev.client)}: ${escapeHtml(ev.title)}</span>
                    <div class="claim-release-btn" data-key="${escapeHtml(ev.key)}" data-person="${escapeHtml(person)}">✕</div>
                  </div>
                </div>
              `;
              }).join('')
            : '<div class="person-lane-empty">Nothing claimed</div>';
          return `
            <div class="person-lane">
              <div class="person-lane-name"><span class="person-color-dot" style="background:${personColor(person)};"></span>${escapeHtml(person)}</div>
              <div class="person-lane-drop" data-person="${escapeHtml(person)}">${cards}</div>
            </div>
          `;
        }).join('')}
      </div>
    `).join('');

    teamsEl.querySelectorAll('.claim-release-btn').forEach(btn => {
      btn.addEventListener('click', () => releaseEvent(btn.dataset.key, btn.dataset.person));
    });

    teamsEl.querySelectorAll('.due-date-input').forEach(input => {
      wireDueDateTextInput_(input);
    });

    teamsEl.querySelectorAll('.person-lane-drop').forEach(lane => {
      lane.addEventListener('dragover', (e) => {
        e.preventDefault();
        lane.classList.add('drag-over');
      });
      lane.addEventListener('dragleave', () => lane.classList.remove('drag-over'));
      lane.addEventListener('drop', (e) => {
        e.preventDefault();
        lane.classList.remove('drag-over');
        const key = e.dataTransfer.getData('text/plain');
        if (key) claimEvent(key, lane.dataset.person);
      });
    });
  }

  /** Insights are due this many calendar days before the call. */
  const DUE_DAYS_BEFORE = 3;

  /** 'YYYY-MM-DD' from a Date's LOCAL calendar date (toISOString would use UTC and can be a day off). */
  function toLocalISO_(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  /** A 'YYYY-MM-DD' string as a local-midnight Date. */
  function isoToLocalDate_(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  /** Keeps just 'YYYY-MM-DD' (Sheets can hand a date back as a full timestamp). '' if it isn't a date. */
  function normalizeIso_(v) {
    const m = String(v || '').match(/^(\d{4}-\d{2}-\d{2})/);
    return m ? m[1] : '';
  }

  /** The automatic due date: 3 calendar days before the call, in local time. */
  function autoDueDate_(meetingStart) {
    const d = new Date(meetingStart);
    d.setDate(d.getDate() - DUE_DAYS_BEFORE);
    return toLocalISO_(d);
  }

  /** A claimant's due date: their own override if one was typed, otherwise the automatic date. */
  function effectiveDue_(ev, claimant) {
    return normalizeIso_(claimant && claimant.dueDate) || autoDueDate_(ev.start);
  }

  /** Returns an urgency class for a 'YYYY-MM-DD' due date string, or '' if unset. */
  function dueDateClass_(dueDate) {
    if (!dueDate) return '';
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const due = isoToLocalDate_(dueDate);
    const daysUntil = Math.round((due - today) / 86400000);
    if (daysUntil < 0) return 'due-overdue';
    if (daysUntil <= 1) return 'due-soon';
    return 'due-ok';
  }

  /** Latest allowed due date for an event — the automatic date (3 days before the call). */
  function maxDueDate_(meetingStart) {
    return autoDueDate_(meetingStart);
  }

  /** Parses a typed "M/D/YYYY" string into 'YYYY-MM-DD', or null if it's not a real calendar date. */
  function parseTypedDate_(str) {
    const m = (str || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m) return null;
    const month = parseInt(m[1], 10), day = parseInt(m[2], 10), year = parseInt(m[3], 10);
    const d = new Date(year, month - 1, day);
    // Catches invalid dates like 2/30/2026 — the Date constructor silently rolls those forward.
    if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;
    return year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
  }

  /** Formats a stored 'YYYY-MM-DD' value as 'M/D/YYYY' for display in the text input. Empty string if unset. */
  function formatTypedDate_(isoDate) {
    if (!isoDate) return '';
    const [y, mo, da] = isoDate.split('-');
    return parseInt(mo, 10) + '/' + parseInt(da, 10) + '/' + y;
  }

  /**
   * Wires up a "M/D/YYYY" due-date box. It shows the automatic date (3 days
   * before the call). Typing an EARLIER date overrides it; typing the
   * automatic date, or clearing the box, goes back to automatic. A later
   * date is not allowed. An override is only saved once it is confirmed good.
   */
  function wireDueDateTextInput_(input) {
    input.addEventListener('change', () => {
      const raw = input.value.trim();
      const key = input.dataset.key, person = input.dataset.person, auto = input.dataset.max;

      if (!raw) {                                   // cleared -> back to the automatic date
        input.value = formatTypedDate_(auto);
        input.dataset.current = auto;
        setDueDate(key, person, '');
        return;
      }

      const iso = parseTypedDate_(raw);
      if (!iso) {
        alert('Enter the date as M/D/YYYY (e.g. 8/30/2026).');
        input.value = formatTypedDate_(input.dataset.current || auto);
        return;
      }

      if (iso > auto) {
        alert('The due date can be no later than 3 days before the call. Latest allowed: ' + formatTypedDate_(auto));
        input.value = formatTypedDate_(auto);
        input.dataset.current = auto;
        setDueDate(key, person, '');
        return;
      }

      input.value = formatTypedDate_(iso);          // normalize display (e.g. "08/9/2026" -> "8/9/2026")
      input.dataset.current = iso;
      setDueDate(key, person, iso === auto ? '' : iso);   // the automatic date is stored as "no override"
    });
  }

  /**
   * Shared POST helper for claim/release/setDueDate. Throws with a real
   * error message on failure instead of silently swallowing it — a save
   * that never reached the server should be visible, not just a console log.
   */
  async function postAction_(payload) {
    const res = await fetch(FEED_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight against Apps Script
      body: JSON.stringify(payload),
    });
    let data;
    try {
      data = await res.json();
    } catch (err) {
      throw new Error('Server did not return valid JSON (HTTP ' + res.status + '). The deployed script may be out of date.');
    }
    if (!res.ok || data.error) {
      throw new Error(data.error || ('Request failed (HTTP ' + res.status + ')'));
    }
    return data;
  }

  async function claimEvent(key, person) {
    const ev = allEvents.find(e => e.key === key);
    if (!ev || !person) return;

    ev.claimants = ev.claimants || [];
    if (ev.claimants.some(c => c.claimedBy === person)) return; // already claimed by this person — nothing to do

    // Optimistic update so the UI feels instant
    ev.claimants.push({ claimedBy: person, claimedAt: new Date().toISOString(), dueDate: '' });
    renderUpcoming(allEvents);
    renderCalendarGrid();
    renderInProcessBoard();

    try {
      await postAction_({
        action: 'claim', key: ev.key, client: ev.client, meetingType: ev.meetingType,
        title: ev.title, start: ev.start, name: person,
      });
    } catch (err) {
      console.error('Claim failed to save:', err);
      alert('Could not save this claim — it will revert. ' + err.message);
      ev.claimants = ev.claimants.filter(c => c.claimedBy !== person); // revert the optimistic add
      renderUpcoming(allEvents);
      renderCalendarGrid();
      renderInProcessBoard();
    }
  }

  async function setDueDate(key, person, dueDate) {
    const ev = allEvents.find(e => e.key === key);
    if (!ev) return;
    const claimant = (ev.claimants || []).find(c => c.claimedBy === person);
    if (!claimant) return;
    const previousDueDate = claimant.dueDate;

    claimant.dueDate = dueDate; // optimistic
    renderUpcoming(allEvents);
    renderInProcessBoard();

    try {
      await postAction_({ action: 'setDueDate', key: key, name: person, dueDate: dueDate });
    } catch (err) {
      console.error('Due date failed to save:', err);
      alert('Could not save this due date — it will revert. ' + err.message);
      claimant.dueDate = previousDueDate; // revert the optimistic change
      renderUpcoming(allEvents);
      renderInProcessBoard();
    }
  }

  async function releaseEvent(key, person) {
    const ev = allEvents.find(e => e.key === key);
    if (!ev || !person) return;
    const removed = (ev.claimants || []).find(c => c.claimedBy === person);

    ev.claimants = (ev.claimants || []).filter(c => c.claimedBy !== person);
    renderUpcoming(allEvents);
    renderCalendarGrid();
    renderInProcessBoard();

    try {
      await postAction_({ action: 'release', key: key, name: person });
    } catch (err) {
      console.error('Release failed to save:', err);
      alert('Could not remove this claim — it will come back. ' + err.message);
      if (removed) ev.claimants.push(removed); // revert the optimistic removal
      renderUpcoming(allEvents);
      renderCalendarGrid();
      renderInProcessBoard();
    }
  }

  // A bracket is a data request if its WORDS mention SEO / Content / Video / CRO / PPC / Paid
  // (so "[PPC, SEO, Content]" and "[monthly SEO/Content Wins]" count; "[Strategy Call]" doesn't).
  function isDataRequest_(ev) {
    const t = ' ' + String(ev.meetingType || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ') + ' ';
    return /\b(seo|content|video|cro|ppc|paid)\b/.test(t);
  }

  /** Small first-name tags (one per responsible person) for an entry on the month grid. */
  function claimantTagsHtml_(ev, claimants) {
    if (claimants.length) {
      return `<div class="day-claimants">` + claimants.map(c =>
        `<span class="day-claimant" style="background:${personColor(c.claimedBy)};" title="${escapeHtml(c.claimedBy)} — due ${escapeHtml(formatTypedDate_(effectiveDue_(ev, c)))}">${escapeHtml(String(c.claimedBy).split(' ')[0])}</span>`
      ).join('') + `</div>`;
    }
    // Only flag "unclaimed" for upcoming data requests, not history or non-data meetings.
    if (isDataRequest_(ev) && new Date(ev.end) >= new Date()) {
      return `<div class="day-claimants"><span class="day-claimant unclaimed">unclaimed</span></div>`;
    }
    return '';
  }

  /** "Responsible:" row for the day popover — full names, colors, due dates. */
  function popoverClaimantsHtml_(ev, claimants) {
    if (!claimants.length) {
      return (isDataRequest_(ev) && new Date(ev.end) >= new Date())
        ? `<div class="day-popover-claimants"><span class="day-popover-resp-label">Responsible:</span><span class="day-claimant unclaimed">unclaimed</span></div>`
        : '';
    }
    return `<div class="day-popover-claimants"><span class="day-popover-resp-label">Responsible:</span>` + claimants.map(c =>
      `<span class="day-claimant" style="background:${personColor(c.claimedBy)};font-size:10px;padding:2px 6px;">${escapeHtml(c.claimedBy)} · due ${escapeHtml(formatTypedDate_(effectiveDue_(ev, c)))}</span>`
    ).join('') + `</div>`;
  }

  /**
   * Due-date entries for the calendar, keyed by the day they fall on. Every
   * data-request meeting (or any meeting someone is assigned to) is due 3
   * days before the call; people with their own earlier date get their own
   * entry on that date.
   */
  function dueEntriesByDate_(events) {
    const byDate = new Map();
    events.forEach(ev => {
      const claimants = ev.claimants || [];
      if (!claimants.length && !isDataRequest_(ev)) return;
      const groups = new Map();                       // 'YYYY-MM-DD' -> claimants due that day
      if (!claimants.length) groups.set(autoDueDate_(ev.start), []);
      claimants.forEach(c => {
        const iso = effectiveDue_(ev, c);
        if (!groups.has(iso)) groups.set(iso, []);
        groups.get(iso).push(c);
      });
      groups.forEach((people, iso) => {
        const key = isoToLocalDate_(iso).toDateString();
        if (!byDate.has(key)) byDate.set(key, []);
        byDate.get(key).push({ ev, iso, claimants: people });
      });
    });
    byDate.forEach(list => list.sort((a, b) => new Date(a.ev.start) - new Date(b.ev.start)));
    return byDate;
  }

  /** Past its due date while the call is still ahead. */
  function isOverdueDue_(ev, iso) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return isoToLocalDate_(iso) < today && new Date(ev.end) >= new Date();
  }

  function callChipHtml_(ev) {
    return `<div class="day-chip" title="${escapeHtml(ev.client + ' — ' + ev.meetingType + ' — AM: ' + ev.am + ': ' + ev.title)}"><strong>${escapeHtml(ev.client)}</strong> ${escapeHtml(ev.meetingType)}</div>${claimantTagsHtml_(ev, ev.claimants || [])}`;
  }

  function dueChipHtml_(entry) {
    const { ev, iso, claimants } = entry;
    const callWhen = new Date(ev.start).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const cls = isOverdueDue_(ev, iso) ? ' overdue' : '';
    return `<div class="day-chip due-chip${cls}" title="${escapeHtml('Insights due for ' + ev.client + ' — ' + ev.meetingType + ' (call: ' + callWhen + ')')}"><strong>DUE</strong> ${escapeHtml(ev.client)}</div>${claimantTagsHtml_(ev, claimants)}`;
  }

  function closePopover() {
    const existing = document.querySelector('.day-popover');
    if (existing) existing.remove();
  }

  function showDayPopover(cellEl, dateObj, dayCalls, dayDue) {
    closePopover();
    const pop = document.createElement('div');
    pop.className = 'day-popover';
    const dateLabel = dateObj.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });

    const callsHtml = dayCalls.map(ev => `
        <div class="day-popover-item">
          <div class="day-popover-time">${formatTime(ev.start, ev.allDay)}</div>
          <span class="client-tag" style="margin-top:4px;">${escapeHtml(ev.client)}</span>
          <span class="meeting-type-tag">${escapeHtml(ev.meetingType)}</span>
          ${amTagHtml(ev)}
          ${ev.moved ? movedBadgeHtml_(ev) : ''}
          <div>${escapeHtml(ev.title)}</div>
          ${popoverClaimantsHtml_(ev, ev.claimants || [])}
        </div>`).join('');

    const dueHtml = dayDue.map(({ ev, claimants }) => {
      const callWhen = new Date(ev.start).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      return `
        <div class="day-popover-item">
          <div class="day-popover-time">DUE</div>
          <span class="client-tag" style="margin-top:4px;">${escapeHtml(ev.client)}</span>
          <span class="meeting-type-tag">${escapeHtml(ev.meetingType)}</span>
          ${amTagHtml(ev)}
          <div>For the call: ${escapeHtml(callWhen)}</div>
          ${popoverClaimantsHtml_(ev, claimants)}
        </div>`;
    }).join('');

    // Section headings only when both kinds are on screen at once.
    const both = dayCalls.length && dayDue.length;
    pop.innerHTML = `
      <span class="day-popover-close">✕</span>
      <div class="day-popover-title">${dateLabel}</div>
      ${dayCalls.length ? (both ? '<div class="day-popover-section">Calls</div>' : '') + callsHtml : ''}
      ${dayDue.length ? (both ? '<div class="day-popover-section">Due dates</div>' : '') + dueHtml : ''}
    `;
    document.body.appendChild(pop);

    const rect = cellEl.getBoundingClientRect();
    const popRect = pop.getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 6;
    if (left + popRect.width > window.innerWidth - 12) left = window.innerWidth - popRect.width - 12;
    if (top + popRect.height > window.innerHeight - 12) top = rect.top - popRect.height - 6;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';

    pop.querySelector('.day-popover-close').addEventListener('click', closePopover);
  }

  function renderCalendarNavTitle() {
    document.getElementById('calendarNavTitle').textContent =
      viewMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  }

  /** Highlights the active button in the Calls / Due dates switch. */
  function updateViewToggle_() {
    document.querySelectorAll('#viewToggle .view-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.view === calendarView);
    });
  }

  function setCalendarView_(view) {
    calendarView = view;
    try { localStorage.setItem('calendarView', view); } catch (err) { /* storage unavailable — still works this session */ }
    updateViewToggle_();
    renderCalendarGrid();
  }

  function renderCalendarGrid() {
    closePopover();
    renderCalendarNavTitle();
    updateViewToggle_();

    const showCalls = calendarView !== 'due';
    const showDue = calendarView !== 'calls';
    const callsByDate = showCalls ? groupByDateKey(allEvents) : new Map();
    const dueByDate = showDue ? dueEntriesByDate_(allEvents) : new Map();

    const year = viewMonth.getFullYear();
    const month = viewMonth.getMonth();
    const firstOfMonth = new Date(year, month, 1);
    const startOffset = firstOfMonth.getDay(); // 0=Sun
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const gridStart = new Date(year, month, 1 - startOffset);

    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    const today = new Date();

    let html = WEEKDAY_LABELS.map(w => `<div class="weekday-header">${w}</div>`).join('');

    for (let i = 0; i < totalCells; i++) {
      const cellDate = new Date(gridStart);
      cellDate.setDate(gridStart.getDate() + i);
      const isOutside = cellDate.getMonth() !== month;
      const isToday = cellDate.toDateString() === today.toDateString();
      const dayKey = cellDate.toDateString();
      const dayCalls = (callsByDate.get(dayKey) || []).slice().sort((a, b) => new Date(a.start) - new Date(b.start));
      const dayDue = dueByDate.get(dayKey) || [];

      const items = dayCalls.map(callChipHtml_).concat(dayDue.map(dueChipHtml_));
      const visibleItems = items.slice(0, 3);
      const overflowCount = items.length - visibleItems.length;
      const chipsHtml = visibleItems.join('') + (overflowCount > 0 ? `<div class="day-chip-more">+${overflowCount} more</div>` : '');

      html += `
        <div class="day-cell${isOutside ? ' outside-month' : ''}${isToday ? ' is-today' : ''}"
             data-date="${cellDate.toISOString()}"
             data-day-key="${escapeHtml(dayKey)}"
             ${items.length ? 'data-has-events="1"' : ''}>
          <div class="day-number">${cellDate.getDate()}</div>
          ${chipsHtml}
        </div>
      `;
    }

    contentEl.innerHTML = `<div class="calendar-grid">${html}</div>`;

    contentEl.querySelectorAll('.day-cell[data-has-events]').forEach(cell => {
      cell.style.cursor = 'pointer';
      cell.addEventListener('click', () => {
        const dateObj = new Date(cell.dataset.date);
        const key = cell.dataset.dayKey;
        const calls = (callsByDate.get(key) || []).slice().sort((a, b) => new Date(a.start) - new Date(b.start));
        showDayPopover(cell, dateObj, calls, dueByDate.get(key) || []);
      });
    });
  }

  document.querySelectorAll('#viewToggle .view-btn').forEach(btn => {
    btn.addEventListener('click', () => setCalendarView_(btn.dataset.view));
  });
  updateViewToggle_();

  document.getElementById('prevMonthBtn').addEventListener('click', () => {
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1);
    renderCalendarGrid();
  });
  document.getElementById('nextMonthBtn').addEventListener('click', () => {
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1);
    renderCalendarGrid();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    viewMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    renderCalendarGrid();
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.day-popover') && !e.target.closest('.day-cell')) closePopover();
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function movedBadgeHtml_(ev) {
    const oldStr = new Date(ev.previousStart).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const newStr = new Date(ev.start).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    return `<span class="moved-badge" title="Moved from ${escapeHtml(oldStr)} to ${escapeHtml(newStr)}">MOVED</span>`;
  }

  function amTagHtml(ev, extraStyle) {
    const style = extraStyle ? ` style="${extraStyle}"` : '';
    if (ev.amEmail) {
      return `<a class="am-tag" href="mailto:${escapeHtml(ev.amEmail)}" title="Email ${escapeHtml(ev.am)}"${style}>${escapeHtml(ev.am)}</a>`;
    }
    return `<span class="am-tag"${style}>${escapeHtml(ev.am)}</span>`;
  }

  /**
   * Alerts once per browser per distinct reschedule — a move is uniquely
   * identified by (event id + movedDetectedAt), so a second reschedule of
   * the same meeting alerts again, but refreshing the page never re-alerts
   * for one already seen.
   */
  function notifyOfMovedMeetings_(events) {
    const seenKey = 'seenMovedMeetings';
    let seen;
    try {
      seen = new Set(JSON.parse(localStorage.getItem(seenKey) || '[]'));
    } catch (err) {
      seen = new Set();
    }

    const newlyMoved = events.filter(ev => ev.moved && !seen.has(ev.id + '|' + ev.movedDetectedAt));
    if (!newlyMoved.length) return;

    const lines = newlyMoved.map(ev => {
      const oldStr = new Date(ev.previousStart).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      const newStr = new Date(ev.start).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      return `• ${ev.client}: ${ev.title} — moved from ${oldStr} to ${newStr}`;
    });
    alert('Meeting(s) rescheduled:\n\n' + lines.join('\n'));

    newlyMoved.forEach(ev => seen.add(ev.id + '|' + ev.movedDetectedAt));
    localStorage.setItem(seenKey, JSON.stringify(Array.from(seen)));
  }

  /**
   * Reads the feed's own status fields so a problem is visible on the page
   * instead of looking like "nothing is allocated":
   *  - no backendVersion  -> the deployed script is an old version
   *  - allocation.error   -> allocation crashed (message shown)
   *  - matched but nobody saved -> claims aren't being stored/read
   */
  const EXPECTED_BACKEND = 'client-allocation-v2';

  function backendStatus_(data) {
    if (!data.backendVersion || data.backendVersion !== EXPECTED_BACKEND) {
      return { warn: true, text: '⚠ backend is an old version — paste the latest calendar-webapp.gs and deploy it as a New version' };
    }
    const a = data.allocation || {};
    if (a.error) return { warn: true, text: '⚠ auto-assign failed: ' + a.error };
    const now = new Date();
    const upcoming = data.events.filter(ev => new Date(ev.end) >= now);
    const assigned = upcoming.filter(ev => (ev.claimants || []).length).length;
    if (a.eventsMatched > 0 && assigned === 0) {
      return { warn: true, text: '⚠ ' + a.eventsMatched + ' meetings matched people but no claims came back — check the In Process Claims tab' };
    }
    if (!a.upcomingTracked) return { warn: false, text: '· no upcoming tracked meetings' };
    return { warn: false, text: '· ' + assigned + ' of ' + upcoming.length + ' upcoming meetings assigned' };
  }

  async function fetchEvents() {
    try {
      const res = await fetch(FEED_URL, { cache: 'no-store' });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      // The same person on the same meeting is one claim — drop repeats the feed may still contain.
      data.events.forEach(ev => {
        const seen = new Set();
        ev.claimants = (ev.claimants || []).filter(c => {
          if (seen.has(c.claimedBy)) return false;
          seen.add(c.claimedBy);
          return true;
        });
      });
      allEvents = data.events;
      renderCalendarGrid();
      renderUpcoming(allEvents);
      renderInProcessBoard();
      notifyOfMovedMeetings_(allEvents);
      pulseDotEl.classList.remove('stale');
      const t = new Date(data.generatedAt);
      const errNote = (data.errors && data.errors.length) ? ` (${data.errors.length} calendar(s) failed)` : '';
      syncTextEl.textContent = 'Synced ' + t.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) + errNote;
      if (data.errors && data.errors.length) console.warn('Calendar sync issues:', data.errors);

      const status = backendStatus_(data);
      const noteEl = document.getElementById('backendNote');
      noteEl.textContent = status.text;
      noteEl.classList.toggle('warn', status.warn);
      if (status.warn) pulseDotEl.classList.add('stale');
      console.info('Backend:', data.backendVersion || '(old version)', data.allocation || '(no allocation info)');
    } catch (err) {
      pulseDotEl.classList.add('stale');
      syncTextEl.textContent = 'Sync failed';
      if (contentEl.querySelector('.empty-state')) {
        contentEl.innerHTML = `<div class="error-state">Couldn't load the calendar feed. Check the Web App URL and deployment access.</div>`;
      }
      console.error(err);
    }
  }

  fetchEvents();
  setInterval(fetchEvents, REFRESH_MS);
</script>
</body>
</html>
